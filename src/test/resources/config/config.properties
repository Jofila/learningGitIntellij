# Browser Configuration
browser=chrome
headless=false
window.size=1920x1080

# Application URL
app.url=https://www.google.com

# Timeouts (in seconds)
explicit.wait=10
implicit.wait=5
page.load.timeout=15

# Logging
log.level=INFO

# Screenshot on failure
screenshot.on.failure=true
screenshot.path=target/screenshots/

# Video Recording
video.recording=false
video.path=target/videos/